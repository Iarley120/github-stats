
<svg id="gh-dark-mode-only" width="360" height="210"
     xmlns="http://www.w3.org/2000/svg">

<style>
svg {
  font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 14px;
  line-height: 21px;
}

#background {
  width: calc(100% - 10px);
  height: calc(100% - 10px);
  fill: #0d1117;
  stroke: #30363d;
  stroke-width: 1px;
  rx: 6px;
  ry: 6px;
}

foreignObject {
  width: calc(100% - 42px);
  height: calc(100% - 34px);
}

h2 {
  margin-top: 0;
  margin-bottom: 0.75em;
  line-height: 24px;
  font-size: 16px;
  font-weight: 600;
  color: #2f81f7;
}

ul {
  list-style: none;
  padding-left: 0;
  margin-top: 0;
  margin-bottom: 0;
}

li {
  display: inline-flex;
  font-size: 12px;
  margin-right: 1ch;
  align-items: center;
  flex-wrap: nowrap;
  transform: translateX(-500%);
  animation: slideIn 2s ease-in-out forwards;
}

@keyframes slideIn {
  to {
    transform: translateX(0);
  }
}

div.ellipsis {
  height: 176px;
  overflow: hidden;
  text-overflow: ellipsis;
}

.octicon {
  margin-right: 0.5ch;
  vertical-align: top;
}

.progress {
  display: flex;
  height: 8px;
  overflow: hidden;
  background-color: rgba(110, 118, 129, 0.4);
  border-radius: 6px;
  outline: 1px solid transparent;
  margin-bottom: 1em;
}

.progress-item {
  outline: 2px solid #393f47;
  border-collapse: collapse;
}

.lang {
  font-weight: 600;
  margin-right: 4px;
  color: #c9d1d9;
}

.percent {
  color: #8b949e;
}
</style>

<g>
  <rect x="5" y="5" id="background"/>

  <foreignObject x="21" y="17" width="318" height="176">
    <div xmlns="http://www.w3.org/1999/xhtml"
         class="ellipsis">

      <h2>Languages Used (By File Size)</h2>

      <div>
        <span class="progress">
          <span class="progress-item"
                style="background-color:#4F5D95;width:30.971%"></span>
          <span class="progress-item"
                style="background-color:#ec915c;width:21.826%"></span>
          <span class="progress-item"
                style="background-color:#663399;width:17.263%"></span>
          <span class="progress-item"
                style="background-color:#e34c26;width:14.588%"></span>
          <span class="progress-item"
                style="background-color:#f1e05a;width:8.444%"></span>
          <span class="progress-item"
                style="background-color:#3572A5;width:4.015%"></span>
          <span class="progress-item"
                style="background-color:#b07219;width:0.733%"></span>
          <span class="progress-item"
                style="background-color:#555555;width:0.729%"></span>
          <span class="progress-item"
                style="background-color:#384d54;width:0.550%"></span>
          <span class="progress-item"
                style="background-color:#878787;width:0.412%"></span>
          <span class="progress-item"
                style="background-color:#427819;width:0.241%"></span>
          <span class="progress-item"
                style="background-color:#89e051;width:0.227%"></span>
        </span>
      </div>

      <ul>

        <li style="animation-delay:150ms">
          <svg class="octicon" viewBox="0 0 16 16"
               width="16" height="16"
               style="fill:#4F5D95">
            <circle cx="8" cy="8" r="4"/>
          </svg>
          <span class="lang">PHP</span>
          <span class="percent">30.97%</span>
        </li>

        <li style="animation-delay:300ms">
          <svg class="octicon" viewBox="0 0 16 16"
               width="16" height="16"
               style="fill:#ec915c">
            <circle cx="8" cy="8" r="4"/>
          </svg>
          <span class="lang">Zig</span>
          <span class="percent">21.83%</span>
        </li>

        <li style="animation-delay:450ms">
          <svg class="octicon" viewBox="0 0 16 16"
               width="16" height="16"
               style="fill:#663399">
            <circle cx="8" cy="8" r="4"/>
          </svg>
          <span class="lang">CSS</span>
          <span class="percent">17.26%</span>
        </li>

        <li style="animation-delay:600ms">
          <svg class="octicon" viewBox="0 0 16 16"
               width="16" height="16"
               style="fill:#e34c26">
            <circle cx="8" cy="8" r="4"/>
          </svg>
          <span class="lang">HTML</span>
          <span class="percent">14.59%</span>
        </li>

        <li style="animation-delay:750ms">
          <svg class="octicon" viewBox="0 0 16 16"
               width="16" height="16"
               style="fill:#f1e05a">
            <circle cx="8" cy="8" r="4"/>
          </svg>
          <span class="lang">JavaScript</span>
          <span class="percent">8.44%</span>
        </li>

        <li style="animation-delay:900ms">
          <svg class="octicon" viewBox="0 0 16 16"
               width="16" height="16"
               style="fill:#3572A5">
            <circle cx="8" cy="8" r="4"/>
          </svg>
          <span class="lang">Python</span>
          <span class="percent">4.01%</span>
        </li>

        <li style="animation-delay:1050ms">
          <svg class="octicon" viewBox="0 0 16 16"
               width="16" height="16"
               style="fill:#b07219">
            <circle cx="8" cy="8" r="4"/>
          </svg>
          <span class="lang">Java</span>
          <span class="percent">0.73%</span>
        </li>

        <li style="animation-delay:1200ms">
          <svg class="octicon" viewBox="0 0 16 16"
               width="16" height="16"
               style="fill:#555555">
            <circle cx="8" cy="8" r="4"/>
          </svg>
          <span class="lang">C</span>
          <span class="percent">0.73%</span>
        </li>

        <li style="animation-delay:1350ms">
          <svg class="octicon" viewBox="0 0 16 16"
               width="16" height="16"
               style="fill:#384d54">
            <circle cx="8" cy="8" r="4"/>
          </svg>
          <span class="lang">Dockerfile</span>
          <span class="percent">0.55%</span>
        </li>

        <li style="animation-delay:1500ms">
          <svg class="octicon" viewBox="0 0 16 16"
               width="16" height="16"
               style="fill:#878787">
            <circle cx="8" cy="8" r="4"/>
          </svg>
          <span class="lang">Hack</span>
          <span class="percent">0.41%</span>
        </li>

        <li style="animation-delay:1650ms">
          <svg class="octicon" viewBox="0 0 16 16"
               width="16" height="16"
               style="fill:#427819">
            <circle cx="8" cy="8" r="4"/>
          </svg>
          <span class="lang">Makefile</span>
          <span class="percent">0.24%</span>
        </li>

        <li style="animation-delay:1800ms">
          <svg class="octicon" viewBox="0 0 16 16"
               width="16" height="16"
               style="fill:#89e051">
            <circle cx="8" cy="8" r="4"/>
          </svg>
          <span class="lang">Shell</span>
          <span class="percent">0.23%</span>
        </li>

      </ul>
    </div>
  </foreignObject>
</g>
</svg>
