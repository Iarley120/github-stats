
<svg
  id="gh-dark-mode-only"
  width="470"
  height="490"
  viewBox="0 0 470 490"
  xmlns="http://www.w3.org/2000/svg">

  <style>
    svg {
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 13px;
    }

    #background {
      fill: #0d1117;
      stroke: #30363d;
      stroke-width: 1px;
    }

    .title {
      fill: #58a6ff;
      font-size: 17px;
      font-weight: 600;
    }

    .label {
      fill: #c9d1d9;
      font-size: 12px;
    }

    .value {
      fill: #e6edf3;
      font-size: 12px;
      font-weight: 600;
      text-anchor: end;
    }

    .icon {
      fill: #8b949e;
    }

    .row {
      opacity: 0;
      animation: fadeIn 0.5s ease-out forwards;
    }

    .divider {
      stroke: #21262d;
      stroke-width: 1;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }
  </style>

  <!-- Fundo principal -->
  <rect
    id="background"
    x="5"
    y="5"
    width="460"
    height="480"
    rx="8"
    ry="8"/>

  <!-- Título -->
  <text
    x="24"
    y="37"
    class="title">{{ name }}'s GitHub Statistics</text>

  <line
    x1="24"
    y1="53"
    x2="446"
    y2="53"
    class="divider"/>

  <!-- 1. Contribuições -->
  <g class="row" style="animation-delay: 0ms">
    <text x="24" y="80" class="label">
      All-time GitHub contributions
    </text>
    <text x="446" y="80" class="value">
      {{ contributions }}
    </text>
  </g>

  <!-- 2. Repositórios -->
  <g class="row" style="animation-delay: 70ms">
    <text x="24" y="110" class="label">
      Repositories with contributions
    </text>
    <text x="446" y="110" class="value">
      {{ repos }}
    </text>
  </g>

  <!-- 3. Linhas alteradas -->
  <g class="row" style="animation-delay: 140ms">
    <text x="24" y="140" class="label">
      Lines of code changes
    </text>
    <text x="446" y="140" class="value">
      {{ lines_changed }}
    </text>
  </g>

  <!-- 4. Percentual médio de alterações -->
  <g class="row" style="animation-delay: 210ms">
    <text x="24" y="170" class="label">
      Avg. percent of code changes (per repo)
    </text>
    <text x="446" y="170" class="value">
      {{ avg_percent }}
    </text>
  </g>

  <!-- 5. Colaboradores -->
  <g class="row" style="animation-delay: 280ms">
    <text x="24" y="200" class="label">
      Repository collaborators (sum)
    </text>
    <text x="446" y="200" class="value">
      {{ collaborators }}
    </text>
  </g>

  <!-- 6. Contribuidores -->
  <g class="row" style="animation-delay: 350ms">
    <text x="24" y="230" class="label">
      Repository contributors (sum)
    </text>
    <text x="446" y="230" class="value">
      {{ contributors }}
    </text>
  </g>

  <!-- 7. Visualizações -->
  <g class="row" style="animation-delay: 420ms">
    <text x="24" y="260" class="label">
      Repository views (past 14 days)
    </text>
    <text x="446" y="260" class="value">
      {{ views }}
    </text>
  </g>

  <!-- 8. Clones -->
  <g class="row" style="animation-delay: 490ms">
    <text x="24" y="290" class="label">
      Repository clones (past 14 days)
    </text>
    <text x="446" y="290" class="value">
      {{ clones }}
    </text>
  </g>

  <!-- 9. Forks -->
  <g class="row" style="animation-delay: 560ms">
    <text x="24" y="320" class="label">
      Forks
    </text>
    <text x="446" y="320" class="value">
      {{ forks }}
    </text>
  </g>

  <!-- 10. Estrelas -->
  <g class="row" style="animation-delay: 630ms">
    <text x="24" y="350" class="label">
      Stars
    </text>
    <text x="446" y="350" class="value">
      {{ stars }}
    </text>
  </g>

  <!-- 11. Pull Requests -->
  <g class="row" style="animation-delay: 700ms">
    <text x="24" y="380" class="label">
      Pull request contributions
    </text>
    <text x="446" y="380" class="value">
      {{ pr_contributions }}
    </text>
  </g>

  <!-- 12. Issues -->
  <g class="row" style="animation-delay: 770ms">
    <text x="24" y="410" class="label">
      Issue contributions
    </text>
    <text x="446" y="410" class="value">
      {{ issue_contributions }}
    </text>
  </g>

  <!-- 13. Revisões de Pull Requests -->
  <g class="row" style="animation-delay: 840ms">
    <text x="24" y="440" class="label">
      Pull request reviews
    </text>
    <text x="446" y="440" class="value">
      {{ review_contributions }}
    </text>
  </g>

  <!-- Rodapé -->
  <line
    x1="24"
    y1="456"
    x2="446"
    y2="456"
    class="divider"/>

  <text
    x="24"
    y="474"
    font-size="10"
    fill="#8b949e">
    Generated automatically with GitHub Actions
  </text>

</svg>
