
<style>
  svg {
    font-family: -apple-system, BlinkMacSystemFont,
      "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 13px;
  }

  .background {
    fill: #0d1117;
    stroke: #30363d;
    stroke-width: 1.5;
  }

  /* Título visível desde o início */
  .title {
    fill: #58a6ff;
    font-size: 18px;
    font-weight: 600;
    opacity: 1;
  }

  .label {
    fill: #c9d1d9;
    font-size: 13px;
  }

  .value {
    fill: #c9d1d9;
    font-size: 13px;
    text-anchor: end;
  }

  .icon {
    fill: none;
    stroke: #8b949e;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /*
   * Entrada individual das estatísticas.
   * Mesma duração do languages.svg.
   */
  .row {
    opacity: 0;
    transform: translateX(-500px);

    animation-name: slideIn;
    animation-duration: 1.5s;
    animation-timing-function: ease-in-out;
    animation-fill-mode: forwards;
  }

  @keyframes slideIn {
    0% {
      opacity: 0;
      transform: translateX(-500px);
    }

    100% {
      opacity: 1;
      transform: translateX(0);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .row {
      animation: none;
      opacity: 1;
      transform: none;
    }
  }
</style>
