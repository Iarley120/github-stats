
<svg id="gh-dark-mode-only" width="360" height="300" xmlns="http://www.w3.org/2000/svg">
  <style>
    svg {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px;
    }

    #background {
      width: calc(100% - 10px);
      height: calc(100% - 10px);
      fill: #0d1117;
      stroke: #30363d;
      stroke-width: 1px;
      rx: 6px;
      ry: 6px;
    }

    foreignObject {
      width: calc(100% - 42px);
      height: calc(100% - 42px);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: auto;
    }

    th {
      padding: 0.5em;
      padding-top: 0;
      padding-bottom: 12px;
      text-align: left;
      font-size: 14px;
      font-weight: 600;
      color: #58a6ff;
    }

    td {
      padding: 5px 3px;
      font-size: 12px;
      line-height: 18px;
      color: #c9d1d9;
    }

    td:last-child {
      text-align: right;
      white-space: nowrap;
      font-weight: 600;
      color: #e6edf3;
    }

    tr {
      transform: translateX(-200%);
      animation: slideIn 1s ease-in-out forwards;
    }

    thead tr {
      transform: translateX(0);
      animation: none;
    }

    .octicon {
      fill: #8b949e;
      margin-right: 6px;
      vertical-align: middle;
    }

    @keyframes slideIn {
      to {
        transform: translateX(0);
      }
    }
  </style>

  <g>
    <rect x="5" y="5" id="background"/>

    <foreignObject x="21" y="21" width="318" height="258">
      <div xmlns="http://www.w3.org/1999/xhtml">

        <table>
          <thead>
            <tr>
              <th colspan="2">{{ name }}'s GitHub Statistics</th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <td>
                <svg class="octicon" viewBox="0 0 16 16" width="16" height="16">
                  <path d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/>
                </svg>
                Stars
              </td>
              <td>{{ stars }}</td>
            </tr>

            <tr style="animation-delay: 100ms">
              <td>
                <svg class="octicon" viewBox="0 0 16 16" width="16" height="16">
                  <path d="M5 3.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm0 2.122a2.25 2.25 0 10-1.5 0v.878A2.25 2.25 0 005.75 8.5h1.5v2.128a2.251 2.251 0 101.5 0V8.5h1.5a2.25 2.25 0 002.25-2.25v-.878a2.25 2.25 0 10-1.5 0v.878a.75.75 0 01-.75.75h-4.5A.75.75 0 015 6.25v-.878z"/>
                </svg>
                Forks
              </td>
              <td>{{ forks }}</td>
            </tr>

            <tr style="animation-delay: 200ms">
              <td>All-time contributions</td>
              <td>{{ contributions }}</td>
            </tr>

            <tr style="animation-delay: 300ms">
              <td>Lines of code changed</td>
              <td>{{ lines_changed }}</td>
            </tr>

            <tr style="animation-delay: 400ms">
              <td>Repository views (past two weeks)</td>
              <td>{{ views }}</td>
            </tr>

            <tr style="animation-delay: 500ms">
              <td>Repositories with contributions</td>
              <td>{{ repos }}</td>
            </tr>

            <tr style="animation-delay: 600ms">
              <td>Issue contributions</td>
              <td>{{ issue_contributions }}</td>
            </tr>

            <tr style="animation-delay: 700ms">
              <td>Pull request contributions</td>
              <td>{{ pr_contributions }}</td>
            </tr>

            <tr style="animation-delay: 800ms">
              <td>Pull request reviews</td>
              <td>{{ review_contributions }}</td>
            </tr>
          </tbody>
        </table>

      </div>
    </foreignObject>
  </g>
</svg>
