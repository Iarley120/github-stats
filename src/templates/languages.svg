
<svg
  id="gh-dark-mode-only"
  width="500"
  height="480"
  viewBox="0 0 500 480"
  xmlns="http://www.w3.org/2000/svg">

  <style>
    svg {
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 13px;
    }

    /* Fundo escuro permanente */
    #background {
      fill: #0d1117;
      stroke: #30363d;
      stroke-width: 1.5;
    }

    /* Título */
    h2 {
      margin: 0 0 22px 0;
      font-size: 18px;
      font-weight: 600;
      line-height: 26px;
      color: #58a6ff;
    }

    /* Área de conteúdo */
    .content {
      width: 100%;
      height: 100%;
      overflow: hidden;
      color: #c9d1d9;
    }

    /* Barra das linguagens */
    .progress {
      display: flex;
      width: 100%;
      height: 12px;
      overflow: hidden;
      background-color: #21262d;
      border-radius: 6px;
      margin-bottom: 26px;
      outline: 1px solid transparent;
      animation: progressFade 1s ease-out both;
    }

    .progress-item {
      outline: 1px solid #30363d;
      border-collapse: collapse;
    }

    /* Lista das linguagens */
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      column-gap: 16px;
      row-gap: 16px;
    }

    li {
      display: inline-flex;
      align-items: center;
      flex-wrap: nowrap;
      white-space: nowrap;
      font-size: 13px;
      line-height: 20px;
      opacity: 0;
      transform: translateX(-400px);
      animation: slideIn 1s ease-in-out forwards;
    }

    /* Atraso sequencial para as linguagens */
    li:nth-child(1)  { animation-delay: 0.10s; }
    li:nth-child(2)  { animation-delay: 0.18s; }
    li:nth-child(3)  { animation-delay: 0.26s; }
    li:nth-child(4)  { animation-delay: 0.34s; }
    li:nth-child(5)  { animation-delay: 0.42s; }
    li:nth-child(6)  { animation-delay: 0.50s; }
    li:nth-child(7)  { animation-delay: 0.58s; }
    li:nth-child(8)  { animation-delay: 0.66s; }
    li:nth-child(9)  { animation-delay: 0.74s; }
    li:nth-child(10) { animation-delay: 0.82s; }
    li:nth-child(11) { animation-delay: 0.90s; }
    li:nth-child(12) { animation-delay: 0.98s; }
    li:nth-child(n+13) {
      animation-delay: 1.06s;
    }

    /* Ícones das linguagens */
    .octicon {
      fill: #8b949e;
      color: #8b949e;
      margin-right: 6px;
      vertical-align: middle;
      flex-shrink: 0;
    }

    /* Nome da linguagem */
    .lang {
      color: #c9d1d9;
      font-weight: 600;
      margin-right: 4px;
    }

    /* Porcentagem */
    .percent {
      color: #8b949e;
    }

    /* Entrada pela esquerda */
    @keyframes slideIn {
      0% {
        opacity: 0;
        transform: translateX(-400px);
      }

      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Entrada do título */
    .title-animation {
      opacity: 0;
      animation: titleFade 0.8s ease-out forwards;
    }

    @keyframes titleFade {
      from {
        opacity: 0;
        transform: translateY(-12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Entrada da barra */
    @keyframes progressFade {
      from {
        opacity: 0;
        transform: translateX(-100%);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Acessibilidade */
    @media (prefers-reduced-motion: reduce) {
      li,
      .progress,
      .title-animation {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>

  <!-- Fundo -->
  <rect
    id="background"
    x="5"
    y="5"
    width="490"
    height="470"
    rx="7"
    ry="7"/>

  <!-- Conteúdo -->
  <foreignObject
    x="35"
    y="32"
    width="430"
    height="420">

    <div
      xmlns="http://www.w3.org/1999/xhtml"
      class="content">

      <!-- Título animado -->
      <h2 class="title-animation">
        Languages Used (By File Size)
      </h2>

      <!-- Barra de progresso -->
      <div>
        <span class="progress">
          {{ progress }}
        </span>
      </div>

      <!-- Linguagens e porcentagens -->
      <ul>
        {{ lang_list }}
      </ul>

    </div>

  </foreignObject>

</svg>
