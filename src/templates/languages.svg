
<svg
  id="gh-dark-mode-only"
  width="500"
  height="480"
  viewBox="0 0 500 480"
  xmlns="http://www.w3.org/2000/svg">

  <style>
    svg {
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 13px;
    }

    #background {
      fill: #0d1117;
      stroke: #30363d;
      stroke-width: 1.5;
    }

    .content {
      width: 100%;
      height: 100%;
      overflow: hidden;
      color: #c9d1d9;
    }

    h2 {
      margin: 0 0 22px 0;
      font-size: 18px;
      font-weight: 600;
      line-height: 26px;
      color: #58a6ff;
    }

    /* Título fixo, visível desde o início */
    .title-animation {
      opacity: 1;
    }

    /* Barra fixa, como no vídeo */
    .progress {
      display: flex;
      width: 100%;
      height: 12px;
      overflow: hidden;
      background-color: #21262d;
      border-radius: 6px;
      margin-bottom: 26px;
      outline: 1px solid transparent;
    }

    .progress-item {
      outline: 1px solid #30363d;
      border-collapse: collapse;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      column-gap: 16px;
      row-gap: 16px;
    }

    /*
     * Cada linguagem começa fora da área visível
     * e entra individualmente pela esquerda.
     */
    li {
      display: inline-flex;
      align-items: center;
      flex-wrap: nowrap;
      white-space: nowrap;
      font-size: 13px;
      line-height: 20px;

      opacity: 0;
      transform: translateX(-430px);

      animation-name: slideIn;
      animation-duration: 1.5s;
      animation-timing-function: ease-in-out;
      animation-fill-mode: forwards;
    }

    /*
     * Sequência sincronizada com o overview.svg.
     */
    li:nth-child(1)  { animation-delay: 0ms; }
    li:nth-child(2)  { animation-delay: 100ms; }
    li:nth-child(3)  { animation-delay: 200ms; }
    li:nth-child(4)  { animation-delay: 300ms; }
    li:nth-child(5)  { animation-delay: 400ms; }
    li:nth-child(6)  { animation-delay: 500ms; }
    li:nth-child(7)  { animation-delay: 600ms; }
    li:nth-child(8)  { animation-delay: 700ms; }
    li:nth-child(9)  { animation-delay: 800ms; }
    li:nth-child(10) { animation-delay: 900ms; }
    li:nth-child(11) { animation-delay: 1000ms; }
    li:nth-child(12) { animation-delay: 1100ms; }
    li:nth-child(13) { animation-delay: 1200ms; }

    li:nth-child(n+14) {
      animation-delay: 1300ms;
    }

    .octicon {
      fill: #8b949e;
      color: #8b949e;
      margin-right: 6px;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .lang {
      color: #c9d1d9;
      font-weight: 600;
      margin-right: 4px;
    }

    .percent {
      color: #8b949e;
    }

    @keyframes slideIn {
      0% {
        opacity: 0;
        transform: translateX(-430px);
      }

      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      li {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>

  <!-- Fundo escuro -->
  <rect
    id="background"
    x="5"
    y="5"
    width="490"
    height="470"
    rx="7"
    ry="7"/>

  <!-- Conteúdo -->
  <foreignObject
    x="35"
    y="32"
    width="430"
    height="420">

    <div
      xmlns="http://www.w3.org/1999/xhtml"
      class="content">

      <h2 class="title-animation">
        Languages Used (By File Size)
      </h2>

      <div>
        <span class="progress">
          {{ progress }}
        </span>
      </div>

      <ul>
        {{ lang_list }}
      </ul>

    </div>

  </foreignObject>

</svg>
